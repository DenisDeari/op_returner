version: "3.8"

services:
  webapp:
    build: .
    container_name: op_returner
    restart: unless-stopped
    # IPv4 only. With "3000:3000" Docker also listens on [::], and an IPv6 connection is relayed
    # into the container from the bridge gateway — a private address that passes the admin's
    # home-network check. The tunnel reaches the app on the compose network (webapp:3000) and
    # the bookkeeping app through host.docker.internal; neither needs IPv6 here.
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - API_KEY=${API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MNEMONIC=${MNEMONIC}
      - BLOCKCYPHER_TOKEN=${BLOCKCYPHER_TOKEN}
      - WEBHOOK_RECEIVER_BASE_URL=${WEBHOOK_RECEIVER_BASE_URL}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL}
      # Telegram activity notifications. Leave unset to disable them entirely.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - NOTIFY_ENABLED=${NOTIFY_ENABLED:-true}
      # Lightning, through the phoenixd service below. Off unless all three are set;
      # LIGHTNING_ENABLED=false is the kill switch that keeps them set.
      - PHOENIXD_URL=${PHOENIXD_URL}
      - PHOENIXD_PASSWORD=${PHOENIXD_PASSWORD}
      - PHOENIXD_WEBHOOK_SECRET=${PHOENIXD_WEBHOOK_SECRET}
      - LIGHTNING_ENABLED=${LIGHTNING_ENABLED:-true}
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - op-returner-data:/app/backend/data
    networks:
      default:
        aliases:
          - webapp

  # The Lightning node. Reachable only on this compose network, as http://phoenixd:9740;
  # nothing is published. Its password, webhook secret and webhook URL are in phoenix.conf
  # inside the volume, so they never appear in `docker inspect`. See CLAUDE.md, "Lightning".
  phoenixd:
    build: ./deploy/phoenixd
    container_name: phoenixd
    restart: unless-stopped
    volumes:
      - phoenixd-data:/phoenix/.phoenix
    networks:
      default:
        aliases:
          - phoenixd

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - default

volumes:
  op-returner-data:
    external: true
    name: op-returner_op_returner_data
  # Holds the phoenixd seed. External, like the database volume, so no compose command can
  # ever remove it.
  phoenixd-data:
    external: true
    name: op-returner_phoenixd_data

networks:
  default:
    name: op-returner_default
    external: true
